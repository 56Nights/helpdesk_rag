[project]
name = "helpdesk-rag"
version = "1.0.0"
description = "Answers IT support questions from tickets that were actually resolved."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "gradio>=5.0",
    "openai>=1.40",       # Groq speaks the OpenAI API
]

[project.optional-dependencies]
# Semantic retrieval. Pulls in torch (~2 GB), so it is opt-in: the app falls
# back to keyword search with a visible note when it is absent.
embeddings = ["sentence-transformers>=3.0"]
# Downloading the ticket corpus from Kaggle. Not needed with DATA_CSV set.
kaggle = ["kagglehub>=0.3"]
all = ["helpdesk-rag[embeddings,kaggle]"]

[project.scripts]
helpdesk = "rag.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
